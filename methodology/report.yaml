# Presentation layer for the 12-section executive report. Copy ONLY — the section registry
# (Zod schemas, facts-slice selectors, token budgets, which sections are AI) lives in
# lib/ai/sections.ts, because a compiler must check those. Natalie edits this file without a
# code change; a section cannot be declared AI here with no schema there.
#
# This version feeds the report cache key (lib/report/report-hash.ts): bumping it regenerates
# every report without staling any run.
version: "0.3.0"

# The register. Kept word-for-word in sync with SYSTEM_PROMPT in lib/ai/prose.ts — the two
# instruct the same model about the same copy, and letting them drift is how the AI path and the
# deterministic path start sounding like different consultants. Distilled from
# docs/brand/xpg-voice.md (§5 posture, §22 attributes, §23 challenge without condemnation,
# §24 vocabulary, §44 hard rules).
style_spine: >-
  Write as an experienced ministry leader sitting beside a lead pastor, not as a consultant
  grading the church from outside. Plain words, warm but precise. Sentence case. Active voice.
  No em-dashes. No churchy clichés. Name strengths before gaps. State what the data shows
  plainly and hedge what it means: "appears", "suggests", "may" and "likely" attach to the
  interpretation, never to the numbers. Frame gaps as growth constraints, capacity gaps and next
  steps, never as failure, brokenness or blame. Connect what you find to discipleship,
  stewardship and Kingdom impact without collapsing into either "pray more" or "better systems".
  Never invent a number, a category, or a finding. If a fact is absent from the facts you were
  given, do not supply it. Return only the JSON.

sections:
  s1:
    title: "Church Health Assessment"
    templates:
      capacity: "{church_name}. {respondent_phrase}."
      constraint: "{church_name}. {respondent_phrase}."
      foundation: "{church_name}. {respondent_phrase}."
    length_ceiling: 200
    required_mentions: []

  s2:
    title: "Executive summary"
    templates:
      capacity: >-
        Overall health sits at {overall_percent} out of 100, which places {church_name} in the
        {tier_name} band. Every stage is carrying its load, so the strategic question is what to
        build next rather than what to repair.
      constraint: >-
        Overall health sits at {overall_percent} out of 100, which places {church_name} in the
        {tier_name} band. The data points to {primary_name} as the area limiting the rest.
        Strengthening it is what gives the others room to show their true health.
      foundation: >-
        Overall health sits at {overall_percent} out of 100, which places {church_name} in the
        {tier_name} band. The stages are each doing their part, but the enablers underneath them
        are not yet ready to carry what is being built on them.
    length_ceiling: 1400
    required_mentions: [tier_name]

  s3:
    title: "Health dashboard"
    templates:
      capacity: "The eight areas, strongest first. Overall {overall_percent} out of 100, {tier_name}."
      constraint: "The eight areas, strongest first. Overall {overall_percent} out of 100, {tier_name}."
      foundation: "The eight areas, strongest first. Overall {overall_percent} out of 100, {tier_name}."
    length_ceiling: 300
    required_mentions: [tier_name, overall_percent]

  s4:
    title: "What the data suggests"
    templates:
      capacity: "Every stage is working, so what sits in front of you is a growth question."
      constraint: "{primary_name}, at {primary_score} out of 100. This is the area the data points to first."
      foundation: "Foundation. The stages are holding; the enablers underneath them are not yet."
    length_ceiling: 1200
    required_mentions: []

  s5:
    title: "Strengths to protect"
    templates:
      capacity: "Three areas are carrying real weight. Name them and protect them before you change anything."
      constraint: "Protect these first. Three areas are strong, and they are what the rest of the work gets built on."
      foundation: "Three areas are strong. Whatever is limiting you, it is not these, and they are worth protecting deliberately."
    length_ceiling: 2200
    required_mentions: []

  s6:
    title: "Areas to strengthen"
    templates:
      capacity: "Each area below is working and has room to grow. Affirm what holds, then name what is missing."
      constraint: "Each area below sits after {primary_name} on the path or alongside it. Read them with that in mind."
      foundation: "Each area below is leaning on an enabler that is not yet ready. Their scores should be read against that."
    length_ceiling: 6000
    required_mentions: []

  s7:
    title: "Areas below the standard"
    templates:
      capacity: "The six lowest indicators, and what they have in common."
      constraint: "The six lowest indicators, and what they have in common."
      foundation: "The six lowest indicators, and what they have in common."
    length_ceiling: 1200
    required_mentions: []

  s8:
    title: "What leaders are saying"
    templates:
      capacity: "Themes that recurred across the written reflections."
      constraint: "Themes that recurred across the written reflections."
      foundation: "Themes that recurred across the written reflections."
    length_ceiling: 400
    required_mentions: []

  s9:
    title: "Strategic direction"
    templates:
      capacity: >-
        No single area is holding the others back. The map below shows which areas feed which,
        so you can point new investment where it will carry the furthest.
      constraint: >-
        {primary_name} is where the data points. The working model below shows what it caps, and
        why investment further along the path rarely holds.
      foundation: >-
        The enablers below set the ceiling for the stages above them. Until they are
        strengthened, gains at the stage level tend not to stick.
    length_ceiling: 2000
    required_mentions: [primary_name]

  s10:
    title: "30/60/90 roadmap"
    templates:
      capacity: "Ninety days in three phases, starting where your scores are lowest."
      constraint: "Ninety days in three phases. Align, build, scale, with every phase pointed at {primary_name}."
      foundation: "Ninety days in three phases. Align, build and scale, with the enablers going first."
    length_ceiling: 2400
    required_mentions: []

  s12:
    title: "Final executive assessment"
    templates:
      capacity: >-
        {church_name} finishes at {overall_percent} out of 100, in the {tier_name} band, with
        every area carrying its load. The objective for the next ninety days is building the
        capacity to steward what is coming.
      constraint: >-
        {church_name} finishes at {overall_percent} out of 100, in the {tier_name} band. The
        objective for the next ninety days is {primary_name}, so the church can faithfully
        steward where it is being taken next.
      foundation: >-
        {church_name} finishes at {overall_percent} out of 100, in the {tier_name} band. The
        objective for the next ninety days is strengthening the enablers everything else rests
        on.
    length_ceiling: 900
    required_mentions: [tier_name, overall_percent]

  s11:
    title: "Where XPG can partner"
    templates:
      capacity: >-
        XPG partners with churches end to end, bringing the resources most teams cannot staff on their own, from technology and working systems to leadership development and coaching. Each phase of the roadmap above has a matching engagement.
      constraint: >-
        XPG partners with churches end to end, bringing the resources most teams cannot staff on their own, from technology and working systems to leadership development and coaching. Each phase of the roadmap above has a matching engagement.
      foundation: >-
        XPG partners with churches end to end, bringing the resources most teams cannot staff on their own, from technology and working systems to leadership development and coaching. Each phase of the roadmap above has a matching engagement.
    length_ceiling: 1200
    required_mentions: []

# Gate family 3. Each list captures the OTHER archetypes' thesis FRAMINGS — multi-word phrases,
# never single generic words and never stage names, which are shared vocabulary and would
# false-positive on every report. Matched case-insensitively as substrings.
banned_phrases:
  capacity:
    - "primary growth constraint"
    - "the area limiting the rest"
    - "not yet ready to carry"
    - "set the ceiling for the stages"
  constraint:
    - "every stage is carrying its load"
    - "a question of capacity"
    - "what to build next rather than what to repair"
    - "nothing is capping you"
  foundation:
    - "primary growth constraint"
    - "the area limiting the rest"
    - "every stage is carrying its load"
    - "a question of capacity"

# S10/S11 are fully deterministic in v1 (P4). Selection is keyed by archetype, primary
# constraint, gated enablers and bottom items; the text is used verbatim.
#
# Category keys match methodology/questions.yaml's category ids exactly (guest, conn, disc,
# vol, gen, gov, comm, sys) — verified against tests/methodology/report-yaml.test.ts's
# "covers every category and enabler" coverage check.
action_library:
  categories:
    guest:
      align: "Agree on one definition of a first-time guest and count them the same way every week."
      build: "Assign a named owner to first-contact follow-up within 48 hours."
      scale: "Review the follow-up log monthly and staff to the volume you actually see."
    conn:
      align: "Name the point at which someone stops being a guest and starts belonging."
      build: "Build one repeatable path from second visit to a group, and walk ten people down it."
      scale: "Track that path's completion rate and staff the step that leaks most."
    disc:
      align: "Agree what spiritual growth looks like here, in language your people would use."
      build: "Give every group leader one shared next step to point people toward."
      scale: "Measure movement along that step, not attendance at the meeting."
    vol:
      align: "List every volunteer role and who owns it. Delete the ones nobody owns."
      build: "Create one on-ramp conversation for new volunteers and run it monthly."
      scale: "Set a ratio of volunteers to attenders and staff recruitment to hold it."
    gen:
      align: "Agree what generosity means here beyond the budget line, and who speaks for it."
      build: "Give one person ownership of the giving journey from first gift to second."
      scale: "Track giving participation as a rate, not a total, and review it quarterly."
    gov:
      align: "Write down who decides what. Circulate it to staff and board."
      build: "Set a standing decision rhythm and hold it for a quarter."
      scale: "Review the decision log annually against the written authority map."
    comm:
      align: "Agree the one message every channel is carrying this season."
      build: "Cut your channels to the ones you can maintain weekly."
      scale: "Test whether people can repeat the message back, and adjust."
    sys:
      align: "List the systems you depend on and who administers each."
      build: "Fix the one system whose failure would stop a weekend."
      scale: "Document the two processes that only live in one person's head."
  enablers:
    gov:
      align: "Clarify decision rights before adding any new initiative."
      build: "Put the authority map in front of the board and get it ratified."
      scale: "Audit decisions made outside the map each quarter."
    comm:
      align: "Pick one message and retire the competing ones."
      build: "Build a weekly rhythm you can actually sustain."
      scale: "Measure message recall, not reach."
    sys:
      align: "Name an owner for every system you rely on."
      build: "Close the single point of failure you would feel first."
      scale: "Document and cross-train the two riskiest processes."
  generosity:
    breadth:
      align: "Name giving as discipleship from the platform once this quarter."
      build: "Make first-time giving frictionless and acknowledged within a week."
      scale: "Grow the number of households who give at all, not the size of the top gifts."
    depth:
      align: "Thank your consistent givers personally and specifically."
      build: "Show one clear line from a gift to an outcome, every month."
      scale: "Invite your most committed givers into a next step, not a bigger ask."
    both:
      align: "Say plainly what money does here, and how decisions about it are made."
      build: "Fix the giving experience end to end before you ask for more."
      scale: "Grow participation first, then depth, and report on both."
